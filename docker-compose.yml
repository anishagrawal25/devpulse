version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devpulse:latest
    container_name: devpulse-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/data/dev.db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=devpulse-super-secret-jwt-key-32-chars-minimum-for-security
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - devpulse-data:/app/data

volumes:
  devpulse-data:
    driver: local
